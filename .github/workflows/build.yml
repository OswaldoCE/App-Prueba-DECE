name: Compilar App macOS

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install customtkinter pillow reportlab pyinstaller

      - name: Compilar con PyInstaller
        run: |
          pyinstaller --noconfirm --windowed --add-data "logo_udg.png:." --collect-all customtkinter app_dece.py

      - name: Guardar ejecutable .app
        uses: actions/upload-artifact@v4
        with:
          name: Aplicacion-macOS
          path: dist/app_dece.app
